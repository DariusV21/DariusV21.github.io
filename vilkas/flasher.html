<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VILKAS · Firmware updater</title>
<meta name="description" content="Update VILKAS-TX and VILKAS-RX firmware over USB from the browser.">
<meta name="theme-color" content="#111317">
<style>
:root{
  --bg:#111317; --panel:#16181d; --panel-2:#1c1f26; --line:#2b2f38; --line-2:#3b414b;
  --text:#e6e8eb; --muted:#9ca3af; --accent:#ff5a1f; --accent-ink:#16181d;
  --ok:#3ecf8e; --warn:#f5b83d; --danger:#ff4d4d;
  --display:"Arial Black","Segoe UI Black",Impact,"Helvetica Neue",sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;font:16px/1.5 var(--body);color:var(--text);
  background:
    linear-gradient(var(--bg),var(--bg)) padding-box,
    repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.018) 22px 23px);
  min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.logo{height:56px;width:auto;display:block}
.lang{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.lang button{font:700 12px/1 var(--mono);letter-spacing:.12em;padding:9px 11px;background:transparent;color:var(--muted);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--accent-ink)}
h1{font:900 clamp(26px,6vw,38px)/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:6px 0 10px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 22px;max-width:56ch}
.banner{border:1px solid var(--warn);background:rgba(245,184,61,.08);color:#ffe2a3;border-radius:8px;padding:12px 14px;margin:0 0 18px}

.step{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 18px 62px;margin:0 0 12px;transition:opacity .2s}
.step.locked{opacity:.38;pointer-events:none}
.num{position:absolute;left:16px;top:16px;width:32px;height:32px;display:grid;place-items:center;font:900 15px/1 var(--display);color:var(--accent);border:2px solid var(--accent);border-radius:6px;transform:skewX(-8deg)}
h2{font:700 12px/1.2 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:8px 0 14px}

.units{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit{display:block;text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:14px 14px 12px;color:var(--text);cursor:pointer;font:inherit}
.unit b{display:block;font:900 34px/1 var(--display);letter-spacing:.03em}
.unit span{display:block;margin-top:6px;color:var(--muted);font-size:14px}
.unit small{display:block;font:12px/1.2 var(--mono);letter-spacing:.14em;color:var(--line-2);margin-top:2px}
.unit:hover,.chip:hover{border-color:var(--line-2)}
.unit[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,90,31,.09)}
.unit[aria-pressed="true"] b,.chip[aria-pressed="true"] .chip-v{color:var(--accent)}
.unit[aria-pressed="true"] small{color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:baseline;gap:8px;background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:9px 16px;color:var(--text);cursor:pointer;font:inherit;min-width:92px}
.chip-k{font:12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip-v{font:900 24px/1 var(--display)}
.hint{color:var(--muted);font-size:14px;margin:12px 0 0}
.note{margin:0;font-size:14px}
.note.muted{color:var(--muted)}
.meta-line~.note{margin-top:8px;font-size:13.5px}
.note.warn{color:var(--warn);margin-top:10px}
.meta-line{margin:10px 0 0;font:13px/1.4 var(--mono);color:var(--muted);overflow-wrap:anywhere}
a,.link{color:var(--accent);text-underline-offset:3px}
.link{background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline}

select{width:100%;font:600 17px/1.2 var(--body);color:var(--text);background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:12px 40px 12px 14px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}

.how{margin:0 0 16px;padding-left:20px;color:var(--text)}
.how li{margin:4px 0}
.check{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 12px}
.check.danger{border-color:var(--danger);background:rgba(255,77,77,.07)}
.check input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent)}
.check.danger input{accent-color:var(--danger)}
.check label{font-weight:600;cursor:pointer}
.check p{grid-column:2;margin:0;color:var(--muted);font-size:14px}
details{margin:0 0 16px}
summary{cursor:pointer;color:var(--muted);font:12px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:6px 0}
.adv{display:grid;gap:12px;padding:10px 0 0}
.adv label{font-size:14px;color:var(--text)}
.adv input[type=checkbox]{accent-color:var(--accent);margin-right:8px}
.adv input[type=file]{display:block;margin-top:6px;color:var(--muted);font:13px var(--body);max-width:100%}

.summary{font:13px/1.4 var(--mono);color:var(--muted);margin:0 0 10px;overflow-wrap:anywhere}
.go{width:100%;font:900 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px;padding:18px 16px;cursor:pointer}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go.danger{background:var(--danger);color:#fff}
.go:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--text);outline-offset:2px}

.progress{margin-top:16px}
.stages{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:5px;font-size:14px;color:var(--muted)}
.stages li{padding-left:24px;position:relative}
.stages li::before{content:"";position:absolute;left:4px;top:.5em;width:8px;height:8px;border-radius:50%;border:2px solid var(--line-2)}
.stages li.active{color:var(--text);font-weight:600}
.stages li.active::before{border-color:var(--accent);background:var(--accent);animation:pulse 1s ease-in-out infinite}
.stages li.done::before{border-color:var(--ok);background:var(--ok)}
.stages li.fail{color:var(--danger)}
.stages li.fail::before{border-color:var(--danger);background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.bar-wrap{display:grid;grid-template-columns:1fr 48px;gap:10px;align-items:center;margin-bottom:12px}
.track{height:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar{height:100%;width:0;background:var(--accent);transition:width .15s linear}
.bar-pct{font:13px var(--mono);color:var(--muted);text-align:right}
.result{border-radius:8px;padding:14px 16px;margin-top:14px;border:1px solid}
.result strong{font:900 18px/1.2 var(--display);letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:6px}
.result p{margin:4px 0 0}
.result.ok{border-color:var(--ok);background:rgba(62,207,142,.08)}
.result.ok strong{color:var(--ok)}
.result.fail{border-color:var(--danger);background:rgba(255,77,77,.07)}
.result.fail strong{color:var(--danger)}
.log{margin:8px 0 0;max-height:220px;overflow:auto;background:#0b0c0f;border:1px solid var(--line);border-radius:6px;padding:10px;font:12px/1.45 var(--mono);color:#aeb6c2;white-space:pre-wrap;overflow-wrap:anywhere}
footer{color:var(--muted);font-size:13px;margin-top:22px;text-align:center}
[hidden]{display:none!important}
@media (max-width:480px){
  .step{padding:56px 14px 16px}
  .num{left:14px;top:14px}
  h2{position:absolute;left:58px;top:16px;margin:8px 0 0}
  .logo{height:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" role="img" aria-label="VILKAS" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200"><polygon points="48,18 72,62 100,56 100,182 82,168 60,128 26,110 50,80" fill="#e6e8eb"/>
<polygon points="152,18 128,62 100,56 100,182 118,168 140,128 174,110 150,80" fill="#9ca3af"/>
<polygon points="54,34 68,62 58,70" fill="#ff5a1f"/><polygon points="146,34 132,62 142,70" fill="#ff5a1f"/>
<polygon points="100,56 86,96 100,150 114,96" fill="#9ca3af" opacity=".55"/>
<polygon points="66,98 94,108 74,114" fill="#ff5a1f"/><polygon points="134,98 106,108 126,114" fill="#ff5a1f"/>
<polygon points="90,158 110,158 100,171" fill="#ff5a1f"/><text x="200" y="128" style="font-family:'Arial Black','Segoe UI Black',Impact,sans-serif;font-weight:900;font-size:92px;letter-spacing:4px" fill="#e6e8eb">VILKAS</text><rect x="204" y="146" width="60" height="8" fill="#ff5a1f"/><text x="276" y="156" style="font-family:Consolas,monospace;font-size:20px;letter-spacing:6px" fill="#9ca3af">TX · RX CONTROL</text></svg>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="lt" aria-pressed="false">LT</button>
    </div>
  </header>

  <main>
    <h1 data-i18n="title">Firmware updater</h1>
    <p class="lead" data-i18n="lead"></p>
    <p class="banner" id="unsupported" role="alert" data-i18n="unsupported" hidden></p>

    <section class="step" id="step-unit">
      <span class="num" aria-hidden="true">1</span>
      <h2 data-i18n="s1"></h2>
      <div class="units">
        <button type="button" class="unit" data-unit="tx" aria-pressed="false">
          <b>TX</b><span data-i18n="txName"></span><small>VILKAS-TX</small>
        </button>
        <button type="button" class="unit" data-unit="rx" aria-pressed="false">
          <b>RX</b><span data-i18n="rxName"></span><small>VILKAS-RX</small>
        </button>
      </div>
    </section>

    <section class="step locked" id="step-rev">
      <span class="num" aria-hidden="true">2</span>
      <h2 data-i18n="s2"></h2>
      <div class="chips" id="revs"></div>
      <p class="hint" id="rev-hint"></p>
    </section>

    <section class="step locked" id="step-ver">
      <span class="num" aria-hidden="true">3</span>
      <h2><label for="version" data-i18n="s3"></label></h2>
      <select id="version"></select>
      <div id="ver-meta"></div>
    </section>

    <section class="step locked" id="step-flash">
      <span class="num" aria-hidden="true">4</span>
      <h2 data-i18n="s4"></h2>
      <ol class="how">
        <li id="how-cable"></li>
        <li data-i18n="howPick"></li>
        <li data-i18n="howWait"></li>
      </ol>

      <div class="check" id="erase-box">
        <input type="checkbox" id="erase">
        <label for="erase" data-i18n="eraseLabel"></label>
        <p data-i18n="eraseHelp"></p>
      </div>

      <details>
        <summary data-i18n="advanced"></summary>
        <div class="adv">
          <label><input type="checkbox" id="allports"><span data-i18n="allPorts"></span></label>
          <label><span data-i18n="localLabel"></span>
            <input type="file" id="localfile" accept=".bin,application/octet-stream">
          </label>
          <button type="button" class="link" id="local-clear" data-i18n="localClear" hidden></button>
        </div>
      </details>

      <p class="summary" id="summary"></p>
      <button type="button" class="go" id="go" disabled></button>
      <p class="hint" data-i18n="noPortHint"></p>

      <div class="progress" id="progress" hidden aria-live="polite">
        <ol class="stages" id="stages"></ol>
        <div class="bar-wrap" id="bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden>
          <div class="track"><div class="bar" id="bar"></div></div>
          <span class="bar-pct" id="bar-pct"></span>
        </div>
        <details>
          <summary data-i18n="showLog"></summary>
          <pre class="log" id="log"></pre>
        </details>
      </div>
      <div class="result" id="result" role="status" hidden></div>
    </section>
  </main>

  <footer>
    <span data-i18n="footer"></span>
    <a href="https://github.com/DariusV21/VILKAS/releases" target="_blank" rel="noopener">DariusV21/VILKAS</a>
    · <a href="https://github.com/DariusV21/VILKAS/blob/main/docs/flashing.md" target="_blank" rel="noopener" data-i18n="footerDocs"></a>
  </footer>
</div>
