<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VILKAS System Map</title>
<meta name="description" content="Interactive map of the VILKAS-TX menus, screens and Sim Mode, and of the VILKAS-RX hardware and phone control.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: an instrument-manual spread. Two tabs (TX menus, RX hardware).
   The TX tab is a menu tree hanging off one spine; the RX tab is a left-to-right
   signal path: sources -> board -> outputs. All content comes from the VILKAS data block. */
:root {
  --bg: #ECEFF1;
  --surface: #F8F9FA;
  --surface-2: #E2E7EA;
  --line: #CBD3D8;
  --line-strong: #7E8F9A;
  --fg: #121B22;
  --dim: #4F5F6B;
  --robot: #A8480C;
  --robot-bg: #F6E3D6;
  --remote: #0B6E62;
  --remote-bg: #D5EEE9;
  --link: #1F5FBF;
  --link-bg: #DCE7F8;
  --planned: #6A4FB3;
  --planned-bg: #E6DFF5;
  --warn: #B3261E;
  --display: 'Chakra Petch', 'Arial Narrow', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1317; --surface: #141C22; --surface-2: #1C262E; --line: #26333C; --line-strong: #5B6E7B;
    --fg: #E6ECEF; --dim: #97A8B3;
    --robot: #F0925A; --robot-bg: #3A2316; --remote: #4FC9B6; --remote-bg: #12342F;
    --link: #7FB0F5; --link-bg: #172A47; --planned: #B7A2F0; --planned-bg: #2A2147; --warn: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1317; --surface: #141C22; --surface-2: #1C262E; --line: #26333C; --line-strong: #5B6E7B;
  --fg: #E6ECEF; --dim: #97A8B3;
  --robot: #F0925A; --robot-bg: #3A2316; --remote: #4FC9B6; --remote-bg: #12342F;
  --link: #7FB0F5; --link-bg: #172A47; --planned: #B7A2F0; --planned-bg: #2A2147; --warn: #FF8A80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); margin: 0; }
.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
a { color: var(--link); }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 20px 32px; justify-content: space-between; align-items: flex-end; padding-bottom: 22px; border-bottom: 2px solid var(--fg); }
.brand h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 700; letter-spacing: .14em; line-height: 1; }
.brand p { color: var(--dim); margin-top: 8px; max-width: 54ch; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font: 500 12px/1 var(--mono); border: 1px solid var(--line-strong); padding: 7px 9px; border-radius: 3px; white-space: nowrap; }
.fact b { font-weight: 500; color: var(--dim); margin-right: 6px; }

.tabs { display: flex; gap: 0; margin: 22px 0 28px; border: 2px solid var(--fg); width: fit-content; max-width: 100%; }
.tab { font: 600 14px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 13px 20px; background: transparent; color: var(--fg); border: 0; cursor: pointer; }
.tab + .tab { border-left: 2px solid var(--fg); }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.tab:focus-visible, a:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }

.sec { margin-top: 44px; }
.sec:first-child { margin-top: 0; }
.sec-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 16px; }
.sec-head h2 { font-size: 24px; font-weight: 600; letter-spacing: .02em; }
.sec-head p { color: var(--dim); max-width: 70ch; }

/* chips and tags */
.val { display: inline-block; font: 400 12px/1.2 var(--mono); background: var(--surface-2); border: 1px solid var(--line); padding: 3px 6px; border-radius: 3px; }
.vals { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font: 600 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; white-space: nowrap; }
.tag.rev-d, .tag.planned { background: var(--planned-bg); color: var(--planned); }
.tag.phone-mock { background: var(--link-bg); color: var(--link); }
.tag.robot { background: var(--robot-bg); color: var(--robot); }
.tag.remote { background: var(--remote-bg); color: var(--remote); }
.tag.link { background: var(--link-bg); color: var(--link); }
.tag.cond { border: 1px dashed var(--line-strong); color: var(--dim); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px; }
.card h3 { font-size: 17px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; margin-bottom: 12px; }

/* TX: glance */
.glance { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; }
.oled { background: #0A0F12; color: #DDF3FF; font: 500 14px/1.45 var(--mono); border: 6px solid #2A3640; border-radius: 6px; padding: 12px 14px; aspect-ratio: 9 / 5; display: flex; flex-direction: column; justify-content: space-between; max-width: 340px; }
.oled .r { display: flex; justify-content: space-between; gap: 8px; }
.oled .big { font-size: 26px; line-height: 1; font-weight: 500; }
.oled .rule { border-top: 1px solid #36505F; }
.oled-notes { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13.5px; }
.oled-notes li { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 10px; }
.oled-notes code { font: 500 12px/1.6 var(--mono); color: var(--dim); }
.controls { display: grid; gap: 0; }
.ctl { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.ctl:first-child { border-top: 0; padding-top: 0; }
.ctl b { font: 500 13px/1.5 var(--mono); }
.ctl span { color: var(--dim); font-size: 14px; }

/* TX: tree */
.rootnode { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 4px; margin-left: 0; }
.rootnode b { font: 700 18px/1 var(--display); letter-spacing: .12em; }
.rootnode span { font: 400 13px/1.3 var(--mono); opacity: .85; }
.navhint { color: var(--dim); font-size: 13.5px; margin: 10px 0 0 0; max-width: 90ch; }
.tree { margin: 0 0 0 18px; padding: 22px 0 0; border-left: 2px solid var(--line-strong); }
.branch { position: relative; padding-left: 30px; margin-bottom: 26px; }
.branch::before { content: ""; position: absolute; left: 0; top: 30px; width: 30px; height: 2px; background: var(--line-strong); }
.branch:last-child { margin-bottom: 0; }
.branch:last-child::after { content: ""; position: absolute; left: -32px; top: 31px; bottom: -4px; width: 4px; background: var(--bg); }
.bhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
.bhead h3 { font-size: 28px; font-weight: 700; letter-spacing: .08em; }
.bhead .count { font: 400 12px var(--mono); color: var(--dim); }
.bnote { color: var(--dim); font-size: 13.5px; margin-bottom: 12px; max-width: 85ch; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 11px 12px; min-width: 0; }
.item.has-sub { grid-column: 1 / -1; }
.item-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
.item-name { font: 500 14px/1.3 var(--mono); }
.desc { color: var(--dim); font-size: 13.5px; margin-top: 6px; }
.sub { margin: 12px 0 2px 6px; padding-left: 16px; border-left: 2px dashed var(--line-strong); }
.sub > .items .item { background: var(--bg); }
.branch.t-robot .bhead h3 { color: var(--robot); }
.branch.t-remote .bhead h3 { color: var(--remote); }
.branch.t-link .bhead h3 { color: var(--link); }

.msgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px 18px; }
.msg { display: grid; grid-template-columns: minmax(104px, auto) minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.msg b { font: 500 12.5px/1.5 var(--mono); }
.msg.warn b { color: var(--warn); }
.msg span { color: var(--dim); }

/* RX: signal path */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); }
.stat { padding: 14px 14px 12px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat b { display: block; font: 600 22px/1.1 var(--display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 4px; font-size: 12.5px; color: var(--dim); }
.sys { display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1.3fr) 64px minmax(0, 1fr); align-items: stretch; }
.col { display: grid; gap: 12px; align-content: start; }
.node { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 13px 14px; min-width: 0; }
.node h4 { font-size: 16px; font-weight: 600; letter-spacing: .03em; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.node ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; font-size: 13.5px; color: var(--dim); }
.node .pins { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.node.k-link { border-color: var(--link); }
.node.k-phone { border-color: var(--link); }
.node.k-power { border-color: var(--robot); }
.node.k-out { border-color: var(--line-strong); }
.node.k-planned { border-style: dashed; border-color: var(--planned); }
.board { background: var(--surface); border: 2px solid var(--fg); border-radius: 4px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.board header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.board header h3 { font-size: 26px; font-weight: 700; letter-spacing: .12em; }
.board header span { font: 400 12px var(--mono); color: var(--dim); }
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.blk { border: 1px solid var(--line); background: var(--bg); border-radius: 3px; padding: 9px 10px; min-width: 0; }
.blk b { display: block; font: 500 13px/1.3 var(--mono); }
.blk span { display: block; margin-top: 3px; font-size: 13px; color: var(--dim); }
.wire { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--line-strong); text-align: center; }
.wire svg { width: 100%; height: 14px; }
.wire small { font: 500 10px/1.3 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }

/* RX: phone */
.phone-grid { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 28px; align-items: start; }
.phone-mock { width: 100%; max-width: 260px; border: 3px solid var(--fg); border-radius: 30px; background: var(--surface); padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.phone-mock .ssid { font: 500 12px/1.3 var(--mono); text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.phone-mock .ssid small { display: block; color: var(--dim); font-size: 11px; }
.phone-mock .telem { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.phone-mock .pad { display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 12px; align-items: center; min-height: 200px; }
.stick { aspect-ratio: 1; width: 100%; border: 2px solid var(--link); border-radius: 50%; display: grid; place-items: center; background: var(--link-bg); }
.stick i { display: block; width: 38%; height: 38%; border-radius: 50%; background: var(--link); }
.slider { height: 100%; min-height: 170px; border: 2px solid var(--robot); border-radius: 26px; background: var(--robot-bg); position: relative; }
.slider i { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); width: 34px; height: 34px; border-radius: 50%; background: var(--robot); }
.phone-mock .cap { font: 400 11px/1.3 var(--mono); color: var(--dim); text-align: center; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: s; }
.step { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; padding-top: 0; }
.step .n { font: 700 22px/1 var(--display); color: var(--link); }
.step h4 { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.step p { color: var(--dim); margin-top: 4px; font-size: 14px; }
.step code, .desc code { font: 500 12.5px var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 3px; color: var(--fg); }
.perks { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 20px; }
.note { margin-top: 14px; font-size: 13px; color: var(--dim); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.row:first-child { border-top: 0; }
.row b { font: 500 12.5px/1.5 var(--mono); }
.row span { color: var(--dim); }
.led { display: grid; grid-template-columns: 22px minmax(0, 36%) minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.led:first-child { border-top: 0; }
.led i { width: 12px; height: 12px; border-radius: 50%; background: #E0393E; display: block; }
.led .p { font: 500 12px/1.4 var(--mono); }
.led .m { color: var(--dim); }
@keyframes b-slow { 0%, 49% { opacity: 1 } 50%, 100% { opacity: .15 } }
@keyframes b-fast { 0%, 49% { opacity: 1 } 50%, 100% { opacity: .15 } }
@keyframes b-dbl { 0%, 10% { opacity: 1 } 15%, 25% { opacity: .15 } 30%, 40% { opacity: 1 } 45%, 100% { opacity: .15 } }
@keyframes b-fl { 0%, 20% { opacity: 1 } 25%, 45% { opacity: .2 } 50%, 70% { opacity: 1 } 75%, 100% { opacity: .2 } }
.led i.slow { animation: b-slow 2s steps(1) infinite; }
.led i.fast { animation: b-fast 1s steps(1) infinite; }
.led i.double { animation: b-dbl 2s steps(1) infinite; }
.led i.flicker { animation: b-fl .5s steps(1) infinite; }
.led i.once { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .led i { animation: none !important; } }

table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); border-top: 0; }
.scroll { overflow-x: auto; }
footer { margin-top: 56px; padding-top: 18px; border-top: 2px solid var(--fg); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: 13px; color: var(--dim); }

@media (max-width: 900px) {
  .glance { grid-template-columns: minmax(0, 1fr); }
  .sys { grid-template-columns: minmax(0, 1fr); }
  .wire { flex-direction: row; gap: 14px; padding: 6px 0; }
  .wire > span { width: 44px !important; flex: none; transform: rotate(90deg); margin: 15px 0; }
  .phone-grid { grid-template-columns: minmax(0, 1fr); }
  .phone-mock { margin: 0 auto; }
}
@media (max-width: 560px) {
  .tab { padding: 12px 12px; font-size: 13px; }
  .ctl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .oled-notes li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .branch { padding-left: 22px; }
  .branch::before { width: 22px; }
  .branch:last-child::after { left: -24px; }
  .bhead h3 { font-size: 24px; }
  .led { grid-template-columns: 22px minmax(0, 1fr); }
  .led .m { grid-column: 2; }
}
/* OLED screens (real 72 x 40 renders of the TX firmware, drawn on a canvas) */
.screens { display: flex; flex-wrap: wrap; gap: 14px 12px; margin: 12px 0 4px; }
.scr { margin: 0; display: flex; flex-direction: column; gap: 6px; width: 226px; max-width: 100%; }
.scr canvas { display: block; width: 100%; height: auto; aspect-ratio: 9 / 5; background: #05080C; border: 5px solid #2A3640; border-radius: 5px; image-rendering: pixelated; image-rendering: crisp-edges; }
.scr figcaption { font: 400 12px/1.35 var(--mono); color: var(--dim); }
.item .screens { gap: 10px; }
.rootscreens { margin: 14px 0 0; }
.screens.home { margin-top: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 226px)); }
.screens.home .scr { width: auto; }
.tag.new { background: var(--remote-bg); color: var(--remote); }
.tag.cond { white-space: normal; line-height: 1.3; }
/* RX phone screenshots in a phone bezel */
.shot { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.shot .bezel { background: #05070A; border: 9px solid #20272D; border-radius: 28px; overflow: hidden; box-shadow: 0 1px 0 var(--line-strong); }
.shot.land .bezel { border-width: 9px 14px; border-radius: 24px; }
.shot img { display: block; width: 100%; height: auto; }
.shot figcaption { font-size: 13px; color: var(--dim); max-width: 80ch; }
.shot-drive { max-width: 860px; }
.phone-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; max-width: 420px; }
.phone-grid2 { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 28px; align-items: start; margin-top: 26px; }
.set-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 26px; }
.set-grid .perks { margin-top: 0; }
@media (max-width: 900px) { .phone-grid2, .set-grid { grid-template-columns: minmax(0, 1fr); } .phone-row { max-width: 460px; } }

/* Sim mode */
.sim-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
.map td:first-child, .map th:first-child { white-space: nowrap; }
.map td b { font: 500 12.5px/1.5 var(--mono); }
@media (max-width: 900px) { .sim-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .scr { width: calc(50% - 6px); } .scr figcaption { font-size: 11px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>VILKAS</h1>
      <p id="tagline"></p>
    </div>
    <div class="facts" id="facts"></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="System maps">
    <button class="tab" role="tab" id="tab-tx" data-view="tx" aria-controls="view-tx">TX remote menus</button>
    <button class="tab" role="tab" id="tab-rx" data-view="rx" aria-controls="view-rx">RX hardware and phone control</button>
  </nav>
  <main>
    <section id="view-tx" role="tabpanel" aria-labelledby="tab-tx"></section>
    <section id="view-rx" role="tabpanel" aria-labelledby="tab-rx" hidden></section>
  </main>
  <footer id="foot"></footer>
</div>

<!--
  =====================================================================
  EDIT HERE. Everything the page shows comes from this one object.
  - Change a firmware number: meta.txFw / meta.rxFw
  - Add a menu item: add { name, values:[...], desc } to a branch's items
  - Nest a submenu: give an item a "children" array
  - Tag an item: tag: 'rev-d' | 'planned' | 'phone' | 'new'
  - Show real OLED screens: screens: [['<bitmap id>', 'caption'], ...] on the menu,
    a branch or an item. Bitmap ids are the keys of window.VILKAS_OLED (bottom of the page),
    exported from the firmware renders in Claude outputs/menu_renders (render_menus.py).
  - Move something between tabs or sections: cut and paste the object
  =====================================================================
-->
<script>
window.VILKAS = {
  meta: {
    tagline: 'Low-cost 2.4 GHz radio control for antweight combat robots. ESP32-C3 on both sides, ESP-NOW link, settings stored in the robot.',
    txFw: '5.46', rxFw: '5.36', protocol: 'v4.3', updated: '2026-11-23',
    repo: 'https://github.com/DariusV21/VILKAS',
    guide: 'https://github.com/DariusV21/VILKAS/blob/main/docs/user-guide.md',
    rxDoc: 'https://github.com/DariusV21/VILKAS/blob/main/docs/hardware/VILKAS-RX.md',
    phoneDoc: 'https://github.com/DariusV21/VILKAS/blob/main/docs/phone-control.md',
    simDoc: 'https://github.com/DariusV21/VILKAS/blob/main/docs/user-guide.md#sim-mode-the-remote-as-a-pc-gamepad',
    shop: 'https://lithuanianbots.com/'
  },

  /* ---------------------------- TX tab ---------------------------- */
  tx: {

    facts.append(el('span', { class: 'fact' }, el('b', null, f[0]), f[1]));
  });
  var foot = document.getElementById('foot');
  foot.append(
    el('span', null, 'Based on the VILKAS user guide and hardware docs for TX ' + D.meta.txFw + ' / RX ' + D.meta.rxFw + '.'),
    el('span', null, el('a', { href: D.meta.repo }, 'Documentation, protocol and firmware on GitHub'), ' · Distributed by ', el('a', { href: D.meta.shop }, 'Lithuanian Bots'))
  );

  /* ---------- menu items ---------- */
  function renderItems(items) {
    var wrap = el('div', { class: 'items' });
    items.forEach(function (it) {
      var cell = el('div', { class: 'item' + (it.children ? ' has-sub' : '') },
        el('div', { class: 'item-head' }, el('span', { class: 'item-name' }, it.name), it.tag ? tag(it.tag) : null),
        it.values ? el('div', { class: 'vals' }, it.values.map(function (v) { return el('span', { class: 'val' }, v); })) : null,
        it.desc ? el('p', { class: 'desc' }, it.desc) : null,
        screens(it.screens));
      if (it.children) cell.append(el('div', { class: 'sub' }, renderItems(it.children)));
      wrap.append(cell);
    });
    return wrap;
  }

  /* ---------- TX view ---------- */
  function buildTX() {
    var t = D.tx, root = document.getElementById('view-tx');

    // glance
    var oled = screens(t.home.screens, 'home');
    var notes = el('ul', { class: 'oled-notes' });
    t.home.notes.forEach(function (n) { notes.append(el('li', null, el('code', null, n[0]), el('span', null, n[1]))); });
    var controls = el('div', { class: 'controls' });
    t.controls.forEach(function (c) { controls.append(el('div', { class: 'ctl' }, el('b', null, c[0]), el('span', null, c[1]))); });
    root.append(el('div', { class: 'sec' },
      sec('Remote at a glance', '72 × 40 OLED, 2-axis joystick, weapon knob, FLIP, OK and BIND, a buzzer and a 1S battery. A remote remembers up to 8 robots, and from TX 5.46 it also works as a Bluetooth gamepad for PC simulators.'),
      el('div', { class: 'glance' },
        el('div', { class: 'card' }, el('h3', null, 'Home screen'), oled, notes),
        el('div', { class: 'card' }, el('h3', null, 'Controls'), controls))));

    // tree
    var tree = el('div', { class: 'tree' });
    t.menu.branches.forEach(function (b) {
      var head = el('div', { class: 'bhead' },
        el('h3', null, b.name),
        b.store ? tag(b.theme === 'robot' ? 'robot' : b.theme === 'remote' ? 'remote' : 'link', b.store) : null,
        b.cond ? tag('cond', b.cond) : null,
        el('span', { class: 'count' }, countItems(b.items) + (countItems(b.items) === 1 ? ' item' : ' items')));
      tree.append(el('div', { class: 'branch t-' + b.theme },
        head, b.note ? el('p', { class: 'bnote' }, b.note) : null, screens(b.screens), renderItems(b.items)));
    });
    root.append(el('div', { class: 'sec' },
      sec('Menu tree', 'Every menu and option, with the real screens of the remote. Colour shows where a setting is stored: copper in the robot, teal in the remote.'),
      el('div', { class: 'rootnode' }, el('b', null, 'MENU'), el('span', null, t.menu.open)),
      el('p', { class: 'navhint' }, t.menu.hint),
      screens(t.menu.screens, 'rootscreens'),
      tree));

    // diagnostic
    var dg = t.diagnostic, drows = el('div', { class: 'rows' });
    dg.rows.forEach(function (k) { drows.append(el('div', { class: 'row' }, el('b', null, k[0]), el('span', null, k[1]))); });
    root.append(el('div', { class: 'sec' },
      el('div', { class: 'sec-head' }, el('h2', null, 'Diagnostic'), tag('new', 'Redesigned in TX 5.46'), el('p', null, dg.intro)),
      screens(dg.screens),
      el('div', { class: 'card', style: 'margin-top:14px;max-width:760px' }, drows)));

    // sim mode
    var sm = t.sim;
    var ssteps = el('ol', { class: 'steps' });
    sm.steps.forEach(function (s, i) {
      ssteps.append(el('li', { class: 'step' }, el('span', { class: 'n' }, String(i + 1)), el('div', null, el('h4', null, s[0]), el('p', { html: s[1] }))));
    });
    var mb = el('tbody');
    sm.map.forEach(function (r) { mb.append(el('tr', null, el('td', null, r[0]), el('td', null, el('b', null, r[1])), el('td', null, r[2]))); });
    var snotes = el('div', { class: 'rows' });
    sm.notes.forEach(function (k) { snotes.append(el('div', { class: 'row' }, el('b', null, k[0]), el('span', null, k[1]))); });
    root.append(el('div', { class: 'sec', id: 'sim-mode' },
      el('div', { class: 'sec-head' }, el('h2', null, 'Sim Mode: the remote as a PC gamepad'), tag('new', 'New in ' + sm.since), el('p', null, sm.intro)),
      screens(sm.screens),
      el('div', { class: 'sim-grid' },
        el('div', { class: 'card' }, el('h3', null, 'How to use it'), ssteps),
        el('div', null,
          el('div', { class: 'card scroll' }, el('h3', null, 'Gamepad mapping'),
            el('table', { class: 'map' }, el('thead', null, el('tr', null, ['Remote', 'Gamepad', 'Notes'].map(function (h) { return el('th', null, h); }))), mb)),
          el('div', { class: 'card', style: 'margin-top:16px' }, snotes))),
      el('p', { class: 'note' }, el('a', { href: D.meta.simDoc }, 'Sim Mode in the user guide'))));

    // messages
    var msgs = el('div', { class: 'msgs' });
    t.messages.forEach(function (m) {
      msgs.append(el('div', { class: 'msg' + (m[2] ? ' ' + m[2] : '') }, el('b', null, m[0]), el('span', null, m[1])));
    });
    var sounds = el('div', { class: 'msgs' });
    t.sounds.forEach(function (m) { sounds.append(el('div', { class: 'msg' }, el('b', null, m[0]), el('span', null, m[1]))); });
    root.append(el('div', { class: 'sec' },
      sec('Status messages and sounds', 'What the name line and the buzzer tell you during a match.'),
      el('div', { class: 'card' }, msgs), el('div', { style: 'height:12px' }), el('div', { class: 'card' }, sounds)));

    // hardware
    var tb = el('tbody');
    t.hardware.forEach(function (r) { tb.append(el('tr', null, r.map(function (c, i) { return el(i === 0 ? 'th' : 'td', i === 0 ? { style: 'font-size:13px;color:var(--fg);letter-spacing:0' } : null, c); }))); });
    root.append(el('div', { class: 'sec' }, sec('Remote hardware status'),
      el('div', { class: 'card scroll' }, el('table', null, el('thead', null, el('tr', null, ['Revision', 'Status', 'Firmware'].map(function (h) { return el('th', null, h); }))), tb))));
  }

  /* ---------- RX view ---------- */
  function node(n) {
    var kind = n.kind ? 'k-' + n.kind : 'k-out';
    return el('div', { class: 'node ' + kind },
      el('h4', null, n.name, n.tag ? tag(n.tag) : null),
      el('ul', null, n.lines.map(function (l) { return el('li', null, l); })),
      n.pins ? el('div', { class: 'pins' }, n.pins.map(function (p) { return el('span', { class: 'val' }, p); })) : null);
  }
  function wire(label) {
    var w = el('div', { class: 'wire' }, el('small', null, label));
    w.append(el('span', { html: ARROW_H, style: 'display:block;width:100%' }));
    return w;
  }
  function buildRX() {
    var r = D.rx, root = document.getElementById('view-rx');

    var stats = el('div', { class: 'stats' });
    r.stats.forEach(function (s) { stats.append(el('div', { class: 'stat' }, el('b', null, s[0]), el('span', null, s[1]))); });

    var board = el('div', { class: 'board' },
      el('header', null, el('h3', null, r.board.name), el('span', null, 'Rev C shipping')),
      el('p', { class: 'desc', style: 'margin-top:-6px' }, r.board.sub),
      el('div', { class: 'blocks' }, r.board.blocks.map(function (b) { return el('div', { class: 'blk' }, el('b', null, b[0]), el('span', null, b[1])); })));

    var sys = el('div', { class: 'sys' },
      el('div', { class: 'col' }, r.sources.map(node)),
      wire('radio · wifi · power'),
      el('div', { class: 'col' }, board),
      wire('PWM · signal'),
      el('div', { class: 'col' }, r.outputs.map(node)));

    root.append(
      el('div', { class: 'sec' }, sec('VILKAS-RX at a glance'), stats),
      el('div', { class: 'sec' }, sec('Signal path', 'Three ways to command the robot, one board, four outputs.'), sys));

    // phone
    var p = r.phone;
    var SH = window.VILKAS_SHOTS || {};
    function shot(id, land, cls) {
      var s = SH[id] || {};
      return el('figure', { class: 'shot' + (land ? ' land' : '') + (cls ? ' ' + cls : '') },
        el('div', { class: 'bezel' }, el('img', { src: s.src, width: s.w, height: s.h, alt: p.shots[id], loading: 'lazy' })),
        el('figcaption', null, p.shots[id]));
    }
    var steps = el('ol', { class: 'steps' });
    p.steps.forEach(function (s, i) {
      steps.append(el('li', { class: 'step' }, el('span', { class: 'n' }, String(i + 1)), el('div', null, el('h4', null, s[0]), el('p', { html: s[1] }))));
    });
    var perks = el('div', { class: 'perks', style: 'grid-template-columns:minmax(0,1fr)' });
    p.perks.forEach(function (k) { perks.append(el('div', { class: 'item' }, el('div', { class: 'item-head' }, el('span', { class: 'item-name' }, k[0])), el('p', { class: 'desc' }, k[1]))); });
    root.append(el('div', { class: 'sec' },
      sec('Phone control', 'Any VILKAS-RX can be driven from a phone browser over the robot own Wi-Fi. No app, no remote.'),
      shot('drive', true, 'shot-drive'),
      el('div', { class: 'phone-grid2' },
        el('div', null, el('div', { class: 'phone-row' }, shot('welcome'), shot('portal'))),
        el('div', null, steps)),
      el('div', { class: 'set-grid' }, shot('settings', true), perks),
      el('p', { class: 'note' }, p.note)));

    // protection
    var prot = el('div', { class: 'items' });
    r.protection.forEach(function (k) { prot.append(el('div', { class: 'item' }, el('div', { class: 'item-head' }, el('span', { class: 'item-name' }, k[0])), el('p', { class: 'desc' }, k[1]))); });
    root.append(el('div', { class: 'sec' }, sec('Built-in protection', 'Always on. The failsafe cannot be disabled.'), prot));

    // telemetry + leds
    var tel = el('div', { class: 'rows' });
    r.telemetry.forEach(function (k) { tel.append(el('div', { class: 'row' }, el('b', null, k[0]), el('span', null, k[1]))); });
    var leds = el('div', null);
    r.leds.forEach(function (k) { leds.append(el('div', { class: 'led' }, el('i', { class: k[0] }), el('span', { class: 'p' }, k[1]), el('span', { class: 'm' }, k[2]))); });
    root.append(el('div', { class: 'sec' }, sec('Telemetry and status LED', 'Telemetry is shown on the remote Info screen. The LED shows state without any remote.'),
      el('div', { class: 'two' },
        el('div', { class: 'card' }, el('h3', null, 'Telemetry to the remote'), tel),
        el('div', { class: 'card' }, el('h3', null, 'RX status LED'), leds))));

    // revisions
    var tb = el('tbody');
    r.revisions.forEach(function (row) { tb.append(el('tr', null, row.map(function (c, i) { return el(i === 0 ? 'th' : 'td', i === 0 ? { style: 'font-size:13px;color:var(--fg);letter-spacing:0' } : null, c); }))); });
    root.append(el('div', { class: 'sec' }, sec('Board revisions', 'Flash the firmware image that matches your board revision. The Wi-Fi updater refuses a different one.'),
      el('div', { class: 'card scroll' }, el('table', null, el('thead', null, el('tr', null, ['Revision', 'Status', 'Changes', 'Firmware'].map(function (h) { return el('th', null, h); }))), tb))));
  }

  buildTX();
  buildRX();

  /* ---------- tabs on the URL hash ---------- */
  var views = ['tx', 'rx'];
  function show() {
    var h = (location.hash || '').replace('#', '');
    var v = views.indexOf(h) >= 0 ? h : 'tx';
    views.forEach(function (n) {
      document.getElementById('view-' + n).hidden = n !== v;
      document.getElementById('tab-' + n).setAttribute('aria-selected', n === v ? 'true' : 'false');
      document.getElementById('tab-' + n).tabIndex = n === v ? 0 : -1;
    });
  }
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { location.hash = b.getAttribute('data-view'); show(); });
  });
  window.addEventListener('hashchange', show);
  show();
})();
</script>
